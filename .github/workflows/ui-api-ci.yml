name: ui-api CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ui-api-ci.yml'
      - 'ui-api/**'
  pull_request:
    paths:
      - '.github/workflows/ui-api-ci.yml'
      - 'ui-api/**'

jobs:
  ui-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean prior summary file
        run: rm -f deliverables/run-status.json

      - name: Run full suite
        run: npm run test && npm run record:suite -- --suite full --command "npm run test"

      - name: Run smoke suite
        run: npm run test:smoke && npm run record:suite -- --suite smoke --command "npm run test:smoke"

      - name: Run regression suite
        run: npm run test:regression && npm run record:suite -- --suite regression --command "npm run test:regression"

      - name: Run negative suite
        run: npm run test:negative && npm run record:suite -- --suite negative --command "npm run test:negative"

      - name: Run e2e suite
        run: npm run test:e2e && npm run record:suite -- --suite e2e --command "npm run test:e2e"

      - name: Generate Allure report
        if: always()
        run: npm run allure

      - name: Generate deliverables
        if: always()
        run: npm run generate:deliverables

      - name: Upload ui-api reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-api-reports
          path: |
            ui-api/playwright-report/
            ui-api/allure-report/
            ui-api/allure-results/
            ui-api/deliverables/
            ui-api/test-results/
          if-no-files-found: ignore
